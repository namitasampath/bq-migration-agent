# Light, Material-style theme (inspired by cloud console UIs). Presentation only.
[theme]
base = "light"
primaryColor = "#1A73E8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F9FA"
textColor = "#202124"
linkColor = "#1A73E8"
borderColor = "#DADCE0"
showWidgetBorder = true
showSidebarBorder = true
dataframeBorderColor = "#DADCE0"
dataframeHeaderBackgroundColor = "#F8F9FA"
dataframeHeaderTextColor = "#5F6368"

font = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
codeFont = "'Roboto Mono':https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
codeBackgroundColor = "#F1F3F4"
codeTextColor = "#202124"
baseFontSize = 14
baseRadius = "8px"
buttonRadius = "4px"
headingFontSizes = ["22px", "18px", "16px", "14px", "14px", "14px"]
headingFontWeights = [400, 500, 500, 500, 500, 500]

greenColor = "#188038"
greenTextColor = "#188038"
greenBackgroundColor = "#E6F4EA"
orangeColor = "#B06000"
orangeTextColor = "#B06000"
orangeBackgroundColor = "#FEF7E0"
redColor = "#D93025"
redTextColor = "#D93025"
redBackgroundColor = "#FCE8E6"
blueColor = "#1A73E8"
blueTextColor = "#1A73E8"
blueBackgroundColor = "#E8F0FE"
grayColor = "#5F6368"
grayTextColor = "#5F6368"

[theme.sidebar]
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#FFFFFF"
